sql: "WITH product_revenue AS (\n    SELECT\n        TO_CHAR(o.order_date::date, 'YYYY-MM')\
  \ AS month,\n        p.category,\n        p.product_id,\n        SUM(oi.quantity\
  \ * oi.price) AS revenue\n    FROM public.\"ORDERS\" AS o\n    JOIN public.\"ORDER_ITEMS\"\
  \ AS oi\n        ON o.order_id = oi.order_id\n    JOIN public.\"PRODUCTS\" AS p\n\
  \        ON oi.product_id = p.product_id\n    WHERE o.status = 'paid'\n    GROUP\
  \ BY\n        TO_CHAR(o.order_date::date, 'YYYY-MM'),\n        p.category,\n   \
  \     p.product_id\n),\nranked AS (\n    SELECT\n        *,\n        ROW_NUMBER()\
  \ OVER (\n            PARTITION BY month, category\n            ORDER BY revenue\
  \ DESC, product_id ASC\n        ) AS product_rank\n    FROM product_revenue\n)\n\
  SELECT\n    month,\n    category,\n    product_id,\n    '\u0422\u043E\u0432\u0430\
  \u0440 ' || product_id::text AS product,\n    revenue,\n    product_rank\nFROM ranked\n\
  WHERE product_rank <= 3"
