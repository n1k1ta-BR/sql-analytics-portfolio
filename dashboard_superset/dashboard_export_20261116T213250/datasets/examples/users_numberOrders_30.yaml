sql: "WITH user_orders AS (\n    SELECT\n        u.user_id,\n        COUNT(o.order_id)\
  \ AS paid_orders\n    FROM public.\"USERS\" AS u\n    LEFT JOIN public.\"ORDERS\"\
  \ AS o\n        ON u.user_id = o.user_id\n        AND o.status = 'paid'\n    GROUP\
  \ BY u.user_id\n)\nSELECT\n    user_id,\n    paid_orders,\n    CASE\n        WHEN\
  \ paid_orders = 0 THEN '0 \u0437\u0430\u043A\u0430\u0437\u043E\u0432'\n        WHEN\
  \ paid_orders = 1 THEN '1 \u0437\u0430\u043A\u0430\u0437'\n        WHEN paid_orders\
  \ BETWEEN 2 AND 3 THEN '2\u20133 \u0437\u0430\u043A\u0430\u0437\u0430'\n       \
  \ ELSE '4+ \u0437\u0430\u043A\u0430\u0437\u043E\u0432'\n    END AS segment\nFROM\
  \ user_orders"
