catalog: examples
schema: public
sql: "SELECT\n    o.order_id,\n    o.user_id,\n    o.order_date,\n    COALESCE(o.promo_code,\
  \ '\u0411\u0435\u0437 \u043F\u0440\u043E\u043C\u043E\u043A\u043E\u0434\u0430') AS\
  \ promo_code,\n    u.city,\n    u.signup_channel,\n    SUM(oi.quantity * oi.price)\
  \ AS order_revenue\nFROM public.\"ORDERS\" AS o\nJOIN public.\"ORDER_ITEMS\" AS\
  \ oi\n    ON o.order_id = oi.order_id\nJOIN public.\"USERS\" AS u\n    ON o.user_id\
  \ = u.user_id\nWHERE o.status = 'paid'\nGROUP BY\n    o.order_id,\n    o.user_id,\n\
  \    o.order_date,\n    o.promo_code,\n    u.city,\n    u.signup_channel"
