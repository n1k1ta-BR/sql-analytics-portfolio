catalog: examples
schema: public
sql: "SELECT\n    u.user_id,\n    u.signup_date::date AS signup_date,\n    u.signup_channel,\n\
  \    u.city,\n    CASE\n        WHEN EXISTS (\n            SELECT 1\n          \
  \  FROM public.\"ORDERS\" AS o\n            WHERE o.user_id = u.user_id\n      \
  \        AND o.status = 'paid'\n              AND o.order_date::date >= u.signup_date::date\n\
  \              AND o.order_date::date <\n                  u.signup_date::date +\
  \ INTERVAL '7 days'\n        )\n        THEN 1\n        ELSE 0\n    END AS activated_7d\n\
  FROM public.\"USERS\" AS u"
