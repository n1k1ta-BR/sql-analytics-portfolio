catalog: examples
schema: public
sql: "WITH user_orders AS (\n    SELECT\n        u.user_id,\n        u.city,\n   \
  \     COUNT(o.order_id) AS paid_orders\n    FROM public.\"USERS\" AS u\n    JOIN\
  \ public.\"ORDERS\" AS o\n        ON u.user_id = o.user_id\n    WHERE o.status =\
  \ 'paid'\n    GROUP BY u.user_id, u.city\n),\ncity_stats AS (\n    SELECT\n    \
  \    city,\n        COUNT(*) AS buyers,\n        SUM(\n            CASE WHEN paid_orders\
  \ >= 2 THEN 1 ELSE 0 END\n        ) AS repeat_buyers\n    FROM user_orders\n   \
  \ GROUP BY city\n)\nSELECT\n    city,\n    buyers,\n    repeat_buyers,\n    repeat_buyers\
  \ * 1.0\n        / NULLIF(buyers, 0) AS repeat_rate,\n    SUM(repeat_buyers) OVER\
  \ () * 1.0\n        / NULLIF(SUM(buyers) OVER (), 0) AS overall_repeat_rate\nFROM\
  \ city_stats"
