sql: "WITH order_amounts AS (\n    SELECT\n        o.order_id,\n        o.promo_code,\n\
  \        SUM(oi.quantity * oi.price) AS order_revenue\n    FROM public.\"ORDERS\"\
  \ AS o\n    JOIN public.\"ORDER_ITEMS\" AS oi\n        ON o.order_id = oi.order_id\n\
  \    WHERE o.status = 'paid'\n      AND o.promo_code IS NOT NULL\n    GROUP BY o.order_id,\
  \ o.promo_code\n)\nSELECT\n    promo_code,\n    COUNT(*) AS paid_orders,\n    SUM(order_revenue)\
  \ AS revenue,\n    AVG(order_revenue) AS avg_order_value\nFROM order_amounts\nGROUP\
  \ BY promo_code\nHAVING COUNT(*) >= 20"
